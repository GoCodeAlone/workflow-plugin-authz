name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GONOSUMCHECK: github.com/GoCodeAlone/*
  GONOSUMDB: github.com/GoCodeAlone/*
  GOPRIVATE: github.com/GoCodeAlone/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve dependencies
        run: |
          go mod tidy
          (cd authzcontract && go mod tidy)

      - name: Run go vet
        run: |
          go vet ./...
          (cd authzcontract && go vet ./...)

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTHZ_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/authz_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve dependencies
        run: |
          go mod tidy
          (cd authzcontract && go mod tidy)

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U postgres -d authz_test && exit 0
            sleep 1
          done
          exit 1

      - name: Run PostgreSQL storage contract
        run: |
          set -o pipefail
          GOWORK=off go test ./internal -run '^TestStoragePostgresIntegrationContract$' -v -race -count=1 | tee /tmp/postgres-contract.log
          grep -q -- '--- PASS: TestStoragePostgresIntegrationContract' /tmp/postgres-contract.log
          ! grep -q -- '--- SKIP: TestStoragePostgresIntegrationContract' /tmp/postgres-contract.log

      - name: Run tests
        run: |
          go test ./... -v -race
          (cd authzcontract && go test ./... -v -race)

  build:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o bin/workflow-plugin-authz-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/workflow-plugin-authz
